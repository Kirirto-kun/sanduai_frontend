name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE: https://api.sanduai.kz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:api-base
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: sanduai-frontend:${{ github.sha }}
          build-args: |
            RELEASE_REVISION=${{ github.sha }}
            NEXT_PUBLIC_API_BASE=https://api.sanduai.kz
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime runs as non-root
        run: test "$(docker run --rm --entrypoint id sanduai-frontend:${GITHUB_SHA} -u)" != "0"
      - name: Verify production release contract
        env:
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_BASE: https://api.sanduai.kz
        run: bash scripts/release/preflight.sh
